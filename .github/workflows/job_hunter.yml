name: AI Job Hunter Daily Run

on:
  schedule:
    # Runs daily at 00:00 UTC (8:00 AM Singapore Time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Crucial to allow committing jobs_db.json back to the repo

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Hunter Scraper and AI Filter
      env:
        # Load credentials and configuration from GitHub Secrets
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        SEARCH_KEYWORDS: ${{ secrets.SEARCH_KEYWORDS || 'Python Developer,Software Engineer' }}
        LOCATIONS: ${{ secrets.LOCATIONS || 'Singapore,Remote' }}
        MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD || '80' }}
      run: |
        python main.py

    - name: Commit and Push Job Tracking Database Updates
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if jobs_db.json was created or modified
        if [ -f jobs_db.json ]; then
          git add jobs_db.json
          # Commit only if there are changes to the DB
          if git diff --cached --quiet; then
            echo "No new jobs processed. Database is unchanged."
          else
            git commit -m "chore: update job tracking database [skip ci]"
            git push
          fi
        else
          echo "jobs_db.json does not exist. Skipping database commit."
        fi

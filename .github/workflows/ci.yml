name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Import sorting check (ruff)
        run: ruff check --select I --output-format=github .

      - name: Type check (mypy)
        run: |
          mypy webapp models.py repositories.py schema_migrations.py config.py \
               database.py rule_filter.py score_adjuster.py resume_parser.py \
               resume_scanner.py app.py

      - name: Security scan (bandit)
        run: |
          bandit -c pyproject.toml webapp app.py models.py repositories.py \
                 schema_migrations.py database.py config.py resume_parser.py \
                 resume_scanner.py score_adjuster.py rule_filter.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test with coverage
        run: |
          pytest --cov=webapp --cov=rule_filter --cov=score_adjuster \
                 --cov=database --cov=config --cov=app --cov=models \
                 --cov=repositories --cov=schema_migrations \
                 --cov=resume_scanner --cov=resume_parser \
                 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore